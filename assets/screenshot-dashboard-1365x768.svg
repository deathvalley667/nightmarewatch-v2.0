<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="768" viewBox="0 0 1365 768">
  <rect width="1365" height="768" fill="#071021"/>
  <!-- Top nav -->
  <rect x="0" y="0" width="1365" height="72" fill="#0F1724"/>
  <text x="24" y="46" font-family="Segoe UI, Roboto, Arial" font-size="22" fill="#FFFFFF">Nightmare Watch</text>

  <!-- Left column -->
  <rect x="24" y="96" width="280" height="640" rx="12" fill="#0B1220" />
  <!-- Right content -->
  <rect x="328" y="96" width="1013" height="640" rx="12" fill="#071227" />

  <!-- Dashboard cards -->
  <g transform="translate(352,120)">
    <rect x="0" y="0" width="320" height="140" rx="8" fill="#0F1724" stroke="#111827"/>
    <text x="16" y="28" font-family="Inter, Roboto" font-size="18" fill="#94A3B8">Real-time Scanner</text>
    <text x="16" y="56" font-family="monospace" font-size="14" fill="#FFFFFF">Status: <tspan fill="#00E6A8">OK</tspan></text>

    <rect x="352" y="0" width="320" height="140" rx="8" fill="#0F1724" stroke="#111827"/>
    <text x="368" y="28" font-family="Inter, Roboto" font-size="18" fill="#94A3B8">VPN</text>
    <text x="368" y="56" font-family="monospace" font-size="14" fill="#FFFFFF">Tunnel: <tspan fill="#FF3B3B">Disconnected</tspan></text>

    <rect x="704" y="0" width="320" height="140" rx="8" fill="#0F1724" stroke="#111827"/>
    <text x="720" y="28" font-family="Inter, Roboto" font-size="18" fill="#94A3B8">Threat Feed</text>
    <text x="720" y="56" font-family="monospace" font-size="14" fill="#FFFFFF">10 new detections</text>
  </g>

  <!-- Graph placeholder -->
  <rect x="352" y="276" width="672" height="360" rx="8" fill="#071227" stroke="#111827"/>
  <text x="360" y="296" font-family="Inter" font-size="14" fill="#94A3B8">Activity</text>
  <!-- Small icons on left column -->
  <g transform="translate(48,140)" fill="#94A3B8">
    <text x="36" y="40" font-family="Inter" font-size="16">Dashboard</text>
    <text x="36" y="84" font-family="Inter" font-size="16">Scanner</text>
    <text x="36" y="128" font-family="Inter" font-size="16">VPN</text>
  </g>
</svg>
